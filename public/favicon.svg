<svg xmlns="http://www.w3.org/2000/svg" viewBox="25 25 110 110">
  <!-- Small-size version of the SitesDownloader mark: the blue window tile with an enlarged bolt,
       so it stays legible in a 16px browser tab. -->
  <defs>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect x="25" y="25" width="110" height="110" rx="24" fill="url(#box)"/>
  <path transform="translate(80 79) scale(1.75) translate(-80 -79)" d="M 80 58 L 92 78 H 82 L 84 100 L 68 76 H 78 Z" fill="url(#bolt)" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
